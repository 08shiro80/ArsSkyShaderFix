plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

group = 'com.arsskyfix'
version = '1.0.0'

base.archivesName = 'arsskyfix'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}


repositories {
    maven { url = 'https://maven.parchmentmc.org' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

def refMods = "${projectDir}/libs"

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Compiled against the exact versions shipped in the pack; both are provided at runtime.
    compileOnly files("${refMods}/ars_nouveau-1.21.1-5.13.0.jar")
    compileOnly files("${refMods}/iris-neoforge-1.8.14-beta.1+mc1.21.1.jar")
    // GeckoLib is a transitive dependency of Ars Nouveau, referenced by its tile hierarchy.
    compileOnly "maven.modrinth:geckolib:4.7.1.2"
}
