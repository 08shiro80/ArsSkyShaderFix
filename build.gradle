plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

group = 'com.arsskyfix'
version = '1.0.1'

base.archivesName = 'arsskyfix'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Single source of truth for the mod version: 'version' above. neoforge.mods.toml reads it at runtime
// via ${file.jarVersion} from the jar manifest set here.
jar {
    manifest {
        attributes([
            'Implementation-Version': project.version
        ])
    }
}

// Shader profiles + textures are version-independent and shared with the 1.20.1 build.
// Editing ../shared/resources applies to both; there is no per-project copy.
sourceSets.main.resources.srcDir '../shared/resources'

repositories {
    maven { url = 'https://maven.parchmentmc.org' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Compile-time references only (API surface); provided at runtime by the pack. Pulled from Modrinth.
    compileOnly "maven.modrinth:ars-nouveau:5.11.7"
    compileOnly "maven.modrinth:iris:1.8.12+1.21.1-neoforge"
    // GeckoLib is a transitive dependency of Ars Nouveau, referenced by its tile hierarchy.
    compileOnly "maven.modrinth:geckolib:4.7.1.2"
}
