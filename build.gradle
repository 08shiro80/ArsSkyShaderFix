plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'com.arsskyfix'
version = '1.0.1'
base.archivesName = 'arsskyfix'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Single source of truth for the mod version: 'version' above. mods.toml reads it at runtime via
// ${file.jarVersion} from the jar manifest set here.
jar {
    manifest {
        attributes([
            'Implementation-Version': project.version
        ])
    }
}

// Shader profiles + textures are version-independent and shared with the 1.21.1 build.
// Editing ../shared/resources applies to both; there is no per-project copy.
sourceSets.main.resources.srcDir '../shared/resources'

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                arsskyfix {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Compile-time references only (API surface); provided at runtime by the pack. Pulled from Modrinth by
    // version id (unique per file; version numbers collide across loaders/MC versions -> wrong java target).
    compileOnly fg.deobf("maven.modrinth:ars-nouveau:Hw2aD01e")     // 4.12.7, forge 1.20.1
    compileOnly fg.deobf("maven.modrinth:oculus:iQ1SwGc3")          // 1.20.1-1.8.0, forge 1.20.1
    // GeckoLib is a transitive dependency of Ars Nouveau, referenced by its tile hierarchy.
    compileOnly fg.deobf("maven.modrinth:geckolib:HVdLnQMI")        // 4.8.3, forge 1.20.1
}

mixin {
    add sourceSets.main, "arsskyfix.refmap.json"
    config "arsskyfix.mixins.json"
    config "arsskyfix.iris.mixins.json"
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "arsskyfix",
            "Specification-Vendor"    : "kasch_x",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "kasch_x",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "arsskyfix.mixins.json,arsskyfix.iris.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
